name: GCCC strict replay 2020-2026

on:
  push:
    branches:
      - gccc-replay-2020-2026
    paths:
      - 'gccc_core_prod/replay_2020_to_current.py'
      - 'gccc_core_prod/replay_data/**'
      - '.github/workflows/gccc-replay-2020-2026.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install 'numpy==2.2.6' 'pandas==2.2.3' 'matplotlib==3.10.5' 'tabulate==0.9.0'
      - name: Generate strict walk-forward replay
        working-directory: gccc_core_prod
        run: python replay_2020_to_current.py
      - name: Upload replay bundle
        uses: actions/upload-artifact@v4
        with:
          name: gccc-core-prod-replay-2020-2026
          path: gccc_core_prod/replay_artifacts/**
          if-no-files-found: error
